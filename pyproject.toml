[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibemail"
version = "1.2.0"
description = "Official VibeMail SDK for Python, transactional email"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VibeMail" }]
keywords = ["vibemail", "email", "transactional", "smtp", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://vibemail.ai"
Source = "https://github.com/vibemailai/vibemail-python"
Issues = "https://github.com/vibemailai/vibemail-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/vibemail"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# No "UP": pyupgrade rewrites `Optional[X]` to `X | None`, which is correct in
# annotations under `from __future__ import annotations` but breaks the runtime
# type aliases below on Python 3.9, which this package still supports.
select = ["E", "F", "I", "B"]

[tool.mypy]
# The floor mypy still accepts. Runtime support remains 3.9, which the CI test
# matrix covers.
python_version = "3.10"
strict = true
